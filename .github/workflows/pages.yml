name: Pages

# Publishes the website (site/ + PRIVACY.md) to GitHub Pages:
#   https://dmdhrumilmistry.github.io/narada/
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - site/**
      - PRIVACY.md
      - docs/screenshots/**
      - src/assets/**
      - src/icons/**
      - scripts/build-site.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      # No configure-pages step: the site uses relative links, so it needs no base path,
      # and that step would need extra Pages permissions on this read-only job.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
